name: gas_app

services:
  mongo:
    image: mongo:5.0
    container_name: mongo_gas
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

  usuarios_api:
    build:
      context: ./Backend/Usuarios_api
    container_name: usuariosGas_api
    restart: unless-stopped
    env_file:
      - ./Backend/Usuarios_api/.env
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  pruebas_usuarios_gas:
    build:
      context: ./Backend/Usuarios_api
    container_name: pruebas_usuariosGas_api
    command: >
      sh -c "sleep 15 && pytest /src/pruebas_api.py -v"
    depends_on:
      - usuarios_api
    volumes:
      - ./Backend/Usuarios_api/src:/src

  unidades_api:
    build:
      context: ./Backend/Unidades_api
    container_name: unidadesGas_api
    restart: unless-stopped
    env_file:
      - ./Backend/Unidades_api/.env
    ports:
      - "8001:8001"
    depends_on:
      - mongo

  pruebas_unidades_gas:
    build:
      context: ./Backend/Unidades_api
    container_name: pruebas_unidadesGas_api
    command: >
      sh -c "sleep 15 && pytest /src/pruebas_api.py -v"
    depends_on:
      - unidades_api
    volumes:
      - ./Backend/Unidades_api/src:/src

  vendedores_api:
    build:
      context: ./Backend/Vendedores_api
    container_name: vendedoresGas_api
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - mongo

  pruebas_vendedores_gas:
    build:
      context: ./Backend/Vendedores_api
    container_name: pruebas_vendedoresGas_api
    command: >
      sh -c "sleep 15 && pytest /src/pruebas_api.py -v"
    depends_on:
      - vendedores_api
      - usuarios_api
    volumes:
      - ./Backend/Vendedores_api/src:/src

volumes:
  mongo_data: